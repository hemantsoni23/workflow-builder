version: '3.0'

services:
  caddy:
    image: caddy:alpine
    container_name: caddy-proxy
    ports:
      - "3000:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nextjs
      # - activepieces
      - flowise
    networks:
      - workflow-builder
    restart: unless-stopped
    entrypoint: sh -c "sleep 5 && caddy run --config /etc/caddy/Caddyfile"

  nextjs:
    image: nitink66/nextjs-noyco:latest
    container_name: nextjs
    depends_on:
      - postgres
      - flowise
    env_file: .env
    expose:
      - "3000"
    networks:
      - workflow-builder
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  postgres:
    image: 'postgres'
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file: .env
    environment:
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workflow-builder

  initdb:
    image: 'postgres'
    container_name: postgres-init
    depends_on:
      - postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - workflow-builder
    entrypoint: >
      sh -c "
        sleep 5 &&
        echo 'Creating Databases...' &&
        until pg_isready -h postgres -U ${AP_POSTGRES_USERNAME}; do
          echo 'Waiting for postgres...'
          sleep 2;
        done &&
        PGPASSWORD=${AP_POSTGRES_PASSWORD} psql -h postgres -U ${AP_POSTGRES_USERNAME} -c 'CREATE DATABASE activepieces;' &&
        PGPASSWORD=${AP_POSTGRES_PASSWORD} psql -h postgres -U ${AP_POSTGRES_USERNAME} -c 'CREATE DATABASE flowise;' &&
        PGPASSWORD=${AP_POSTGRES_PASSWORD} psql -h postgres -U ${AP_POSTGRES_USERNAME} -c 'CREATE DATABASE noyco;' &&
        echo 'Databases Created Successfully'
      "

  redis:
    image: 'redis'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - workflow-builder

  activepieces:
    image: workflow-builder_activepieces
    container_name: activepieces
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - app_cache:/usr/src/app/cache
    networks:
      - workflow-builder

  flowise:
    image: worflow_builder-agentbuilder
    restart: always
    container_name: flowise
    depends_on:
      - postgres
    env_file: .env
    expose:
      - "${PORT}"
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - app_cache:/root/.flowise
    working_dir: /usr/src
    networks:
      - workflow-builder
    entrypoint: /bin/sh -c "sleep 5; pnpm start"

volumes:
  postgres_data:
  redis_data:
  app_cache:
  caddy_data:
  caddy_config:

networks:
  workflow-builder:
