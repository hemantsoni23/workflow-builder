

services:

  nextjs:
    build:
      context: ./nextjs-ui
    container_name: nextjs
    ports:
      - "4000:3000"
    networks:
      - workflow-builder
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "3000:80"
    depends_on:
      - nextjs
      - flowise
      - activepieces
    networks:
      - workflow-builder

  postgres:
    image: 'postgres'
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workflow-builder

  initdb:
    image: 'postgres'
    container_name: postgres-init
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    env_file: .env  
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - workflow-builder
    entrypoint: >
      sh -c "
        sleep 5 &&
        echo 'Creating Databases...' &&
        until pg_isready -h postgres -U ${AP_POSTGRES_USERNAME}; do
          echo 'Waiting for postgres...'
          sleep 2;
        done &&
        PGPASSWORD=${AP_POSTGRES_PASSWORD} psql -h postgres -U ${AP_POSTGRES_USERNAME} -c 'CREATE DATABASE activepieces;' &&
        PGPASSWORD=${AP_POSTGRES_PASSWORD} psql -h postgres -U ${AP_POSTGRES_USERNAME} -c 'CREATE DATABASE flowise;' &&
        echo 'Databases Created Successfully'
      "

  redis:
    image: 'redis'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - workflow-builder

  activepieces:
    image: anoop82yadav82/activepieces-noyco
    container_name: activepieces
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - app_cache:/usr/src/app/cache
    networks:
      - workflow-builder

  flowise:
    image: node:18-alpine
    container_name: flowise
    depends_on:
      - postgres
    env_file: .env
    environment:
      - PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS}
      - IFRAME_ORIGINS=${IFRAME_ORIGINS}
      - FLOWISE_FILE_SIZE_LIMIT=${FLOWISE_FILE_SIZE_LIMIT}
      - DEBUG=${DEBUG}
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=${AP_POSTGRES_HOST}
      - DATABASE_PORT=${AP_POSTGRES_PORT}
      - DATABASE_NAME=flowise
      - DATABASE_USER=${AP_POSTGRES_USERNAME}
      - DATABASE_PASSWORD=${AP_POSTGRES_PASSWORD}
      - DATABASE_SSL=false
      - APIKEY_STORAGE_TYPE=${APIKEY_STORAGE_TYPE}
      - APIKEY_PATH=${APIKEY_PATH}
      - SECRETKEY_PATH=${SECRETKEY_PATH}
      - FLOWISE_SECRETKEY_OVERWRITE=${FLOWISE_SECRETKEY_OVERWRITE}
    volumes:
      - app_cache:/root/.flowise
      - ./flowise/packages/ui/build:/usr/src/app/build
    working_dir: /usr/src/app
    networks:
      - workflow-builder
    entrypoint: npx serve -s build -l 3000


volumes:
  postgres_data:
  redis_data:
  app_cache:

networks:
  workflow-builder: